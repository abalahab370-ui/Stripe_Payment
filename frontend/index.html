<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    #summary { color: #555; margin-bottom: 1.5rem; }
    button { width: 100%; margin-top: 1rem; padding: .75rem; font-size: 1rem; color: #fff; background: #1a1a1a; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #error { color: #b00020; margin-top: .75rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Checkout</h1>
  <p id="summary">Loading...</p>

  <div id="product-picker" hidden>
    <label for="product-select">Product</label>
    <select id="product-select"></select>
    <button id="checkout-button" type="button">Continue to payment</button>
  </div>

  <form id="payment-form" hidden>
    <div id="payment-element"></div>
    <button id="pay-button" type="submit">Pay</button>
  </form>
  <p id="error"></p>

  <script>
    const summary = document.getElementById("summary");
    const productPicker = document.getElementById("product-picker");
    const productSelect = document.getElementById("product-select");
    const checkoutButton = document.getElementById("checkout-button");
    const form = document.getElementById("payment-form");
    const payButton = document.getElementById("pay-button");
    const errorBox = document.getElementById("error");

    const API_BASE_URL = location.port === "5501"
      ? `${location.protocol}//${location.hostname}:5000`
      : "";
    let stripe, elements, orderId, products;

    async function fetchJson(url, options, failureMessage) {
      let response;
      try {
        response = await fetch(url, options);
      } catch {
        throw new Error("Could not reach the server. Make sure the Express app is running and open this page from its URL.");
      }

      let data;
      try {
        data = await response.json();
      } catch {
        if (!response.ok) throw new Error(`${failureMessage} (HTTP ${response.status}).`);
        throw new Error("The server returned an invalid JSON response.");
      }

      if (!response.ok) {
        throw new Error(typeof data?.error === "string"
          ? data.error
          : `${failureMessage} (HTTP ${response.status}).`);
      }
      return data;
    }

    async function initialize() {
      try {
        const [configResponse, productsResponse] = await Promise.all([
          fetchJson(`${API_BASE_URL}/api/config`, undefined, "Could not load payment settings"),
          fetchJson(`${API_BASE_URL}/api/products`, undefined, "Could not load products"),
        ]);
        const config = configResponse;
        const catalog = productsResponse;
        if (typeof config.publishableKey !== "string" || !config.publishableKey) {
          throw new Error("Payment settings are missing the publishable key.");
        }
        if (!Array.isArray(catalog.products)) {
          throw new Error("The server returned an invalid product list.");
        }

        stripe = Stripe(config.publishableKey);
        products = catalog.products;
        for (const product of products) {
          const option = document.createElement("option");
          option.value = product.id;
          const price = new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: product.currency,
          }).format(product.amount / 100);
          option.textContent = product.available_stock > 0
            ? `${product.name} - ${price} (${product.available_stock} available)`
            : `${product.name} - ${price} (out of stock)`;
          option.disabled = product.available_stock < 1;
          productSelect.append(option);
        }

        const requestedProduct = new URLSearchParams(location.search).get("product");
        if (requestedProduct && [...productSelect.options].some((option) => option.value === requestedProduct)) {
          productSelect.value = requestedProduct;
        }
        if (productSelect.selectedOptions[0]?.disabled) {
          const availableProduct = [...productSelect.options].find((option) => !option.disabled);
          if (availableProduct) productSelect.value = availableProduct.value;
        }

        productPicker.hidden = products.length === 0;
        checkoutButton.disabled = ![...productSelect.options].some((option) => !option.disabled);
        if (products.length === 0) {
          summary.textContent = "No products are available.";
        } else {
          updateProductSummary();
        }
      } catch (err) {
        summary.textContent = "";
        errorBox.textContent = err.message || "Could not start checkout.";
      }
    }

    function updateProductSummary() {
      const product = products.find((item) => item.id === productSelect.value);
      if (!product) return;
      const price = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: product.currency,
      }).format(product.amount / 100);
      summary.textContent = `${product.name} - ${price}`;
    }

    productSelect.addEventListener("change", updateProductSummary);

    checkoutButton.addEventListener("click", async () => {
      checkoutButton.disabled = true;
      errorBox.textContent = "";
      try {
        const data = await fetchJson(`${API_BASE_URL}/api/checkout`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ productId: productSelect.value }),
        }, "Could not start checkout");
        if (!data.clientSecret || !data.orderId) {
          throw new Error("The server returned incomplete checkout details.");
        }
        orderId = data.orderId;
        elements = stripe.elements({ clientSecret: data.clientSecret });
        elements.create("payment").mount("#payment-element");
        productPicker.hidden = true;
        form.hidden = false;
      } catch (err) {
        errorBox.textContent = err.message || "Could not start checkout.";
        checkoutButton.disabled = false;
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault(); // stop the page reload
      payButton.disabled = true;
      errorBox.textContent = "";

      try {
        const { error } = await stripe.confirmPayment({
          elements,
          confirmParams: { return_url: `${location.origin}/success.html?orderId=${encodeURIComponent(orderId)}` },
        });
        if (error) errorBox.textContent = error.message || "Payment could not be confirmed.";
      } catch (err) {
        errorBox.textContent = err.message || "Payment could not be confirmed.";
      } finally {
        payButton.disabled = false;
      }
    });

    initialize();
  </script>
</body>
</html>
