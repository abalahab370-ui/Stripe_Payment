<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment result</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.4rem; }
    #status { font-size: 1.1rem; }
    .paid { color: #1b7f3b; } .failed { color: #b00020; } .pending { color: #8a6d00; }
  </style>
</head>
<body>
  <h1>Payment result</h1>
  <p id="status" class="pending">Checking your payment...</p>
  <p><a href="/">Back to checkout</a></p>

  <script>
    const statusBox = document.getElementById("status");
    const orderId = new URLSearchParams(location.search).get("orderId");
    const API_BASE_URL = location.port === "5501"
      ? `${location.protocol}//${location.hostname}:5000`
      : "";

    async function fetchJson(url) {
      let response;
      try {
        response = await fetch(url);
      } catch {
        throw new Error("Could not reach the server. Make sure the Express app is running and open this page from its URL.");
      }

      let order;
      try {
        order = await response.json();
      } catch {
        if (!response.ok) throw new Error(`Could not load order status (HTTP ${response.status}).`);
        throw new Error("The server returned an invalid JSON response.");
      }

      if (!response.ok) {
        throw new Error(typeof order?.error === "string"
          ? order.error
          : `Could not load order status (HTTP ${response.status}).`);
      }
      return order;
    }

    // The page only DISPLAYS the result. Only the webhook marks an order as paid.
    // Poll OUR database every 1.5 seconds until the webhook has run
    async function pollOrder(triesLeft = 20) {
      try {
        const order = await fetchJson(`${API_BASE_URL}/api/orders/${encodeURIComponent(orderId)}`);

        if (order.status === "paid") return show("Payment received. Thank you!", "paid");
        if (order.status === "failed") return show("Payment failed. Please try again.", "failed");
      } catch (err) {
        return show(err.message, "failed");
      }

      if (triesLeft > 0) setTimeout(() => pollOrder(triesLeft - 1), 1500);
      else show("Still waiting for confirmation. Refresh in a moment.", "pending");
    }

    function show(text, cssClass) {
      statusBox.textContent = text;
      statusBox.className = cssClass;
    }

    if (orderId) pollOrder();
    else show("Missing order id. Return to checkout and try again.", "failed");
  </script>
</body>
</html>
